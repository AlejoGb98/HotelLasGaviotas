<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Listado de reservas | Hotel Las Gaviotas</title>

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="reservas.css">

  <script src="/src/core/listado-reservas.js" defer></script>
</head>

<body class="admin-page">

  <header class="admin-header">
    <a href="index.html" class="admin-brand">
      <span>Hotel</span>
      <strong>Listado de Reservas</strong>
    </a>

    <span id="cantidad-resultados" class="results-count">
      0 resultados
    </span>
  </header>

  <main class="admin-main">

    <!-- Filtros -->
    <nav class="reservation-filters" aria-label="Filtros de reservas">

      <button
        type="button"
        class="filter-button active"
        data-estado="Todas"
      >
        Todas
        <span id="cantidad-todas">0</span>
      </button>

      <button
        type="button"
        class="filter-button"
        data-estado="Confirmada"
      >
        Confirmadas
        <span id="cantidad-confirmadas">0</span>
      </button>

      <button
        type="button"
        class="filter-button"
        data-estado="Pendiente"
      >
        Pendientes
        <span id="cantidad-pendientes">0</span>
      </button>

      <button
        type="button"
        class="filter-button"
        data-estado="Rechazada"
      >
        Rechazadas
        <span id="cantidad-rechazadas">0</span>
      </button>

      <button
        type="button"
        class="filter-button"
        data-estado="Cancelada"
      >
        Canceladas
        <span id="cantidad-canceladas">0</span>
      </button>

    </nav>

    <!-- Tabla -->
    <div class="reservations-table-container">

      <table class="reservations-table">

        <thead>
          <tr>
            <th>Nro. reserva</th>
            <th>Estado</th>
            <th>Huésped</th>
            <th>Habitación</th>
            <th>Check-in</th>
            <th>Check-out</th>
            <th>Noches</th>
            <th>Total</th>
            <th>Acciones</th>
          </tr>
        </thead>

        <tbody id="tabla-reservas">
          <!-- JavaScript agrega las reservas aquí -->
        </tbody>

      </table>

      <div id="sin-reservas" class="empty-message">
        <h2>No existen reservas</h2>
        <p>No hay reservas para mostrar en esta categoría.</p>

        <a href="index.html#reservas" class="button button--gold">
          Crear una reserva
        </a>
      </div>

    </div>

    <div class="table-footer">

      <p id="texto-resultados">
        Mostrando 0 reservas
      </p>

      <a href="index.html" class="back-link">
        ← Volver al hotel
      </a>

    </div>

  </main>

</body>
</html>
